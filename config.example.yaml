# ─────────────────────────────────────────────────────────────
# 설정 템플릿 (git에 커밋됨)
# 사용법: 이 파일을 config.yaml로 복사한 뒤 실제 과제의 값을 채운다.
#   copy config.example.yaml config.yaml       (Windows)
#   cp config.example.yaml config.yaml         (Linux/macOS)
# config.yaml은 .gitignore로 제외되어 있다 — 실제 과제 정보는 커밋되지 않는다.
# ─────────────────────────────────────────────────────────────

# ── 과제 프로필 ──────────────────────────────────────────────
# 코드에는 특정 과제의 이름·기관·지표가 하드코딩되어 있지 않다.
# 이 섹션이 과제 고유 정보의 단일 진실원천이다 (src/project.py가 읽는다).
project:
  id: "RS-0000-XX000000"            # 과제번호 (placeholder — 실제 값으로 교체)
  title: "OO 기술개발 연구과제"       # 과제명
  first_year: 2022                  # 1차년도의 달력 연도
  n_years: 5                        # 총 연차 수

  # 단계 구분 (없는 과제는 빈 목록 [])
  phases:
    - {name: "1단계", years: [1, 2, 3]}
    - {name: "2단계", years: [4, 5]}

  # 참여기관. 코드(키)는 저장소 안에서만 쓰는 식별자이므로 자유롭게 정한다.
  # aliases: 문서 본문·파일명에서 이 기관을 알아볼 문자열들 (정식명·약칭 모두)
  organizations:
    ORG_MAIN: {role: "주관연구개발기관", name: "주관기업(주)", aliases: ["주관기업"]}
    ORG_HOME: {role: "공동연구개발기관", name: "OO연구원",   aliases: ["OO연구원"]}
    ORG_SUB:  {role: "위탁연구개발기관", name: "OO병원",     aliases: ["OO병원"]}

  # "우리 기관" — 성과 정리 문서·UI 기본 필터가 이 기관 기준으로 만들어진다
  home_org: "ORG_HOME"

  # 성능지표 소관: 지표명에 아래 문자열이 포함되면 해당 기관 담당으로 본다.
  # 어느 목록에도 안 걸리면 indicator_default 기관으로 분류한다.
  indicator_owner:
    ORG_HOME: ["지표 키워드 A", "지표 키워드 B"]
  indicator_default: "ORG_MAIN"

  # 성과 정리 문서에서 앞세울 핵심 지표 순서 (선택, 비우면 이름순)
  core_indicators: []

  # 색인에서 뺄 문서 (파일명 부분일치).
  # 예: 아직 작성되지 않은 빈 양식 보고서 — 이 시스템이 작성을 지원할 산출물이므로
  #     소스로 색인하면 안 된다.
  exclude_docs: []

  # 문서 종류별 검색 권위도. 확정된 공식 기록(보고서)이 중간 논의(회의록)보다
  # 위에 오도록 한다. 평가셋에서 MRR 0.512 → 0.612 개선을 확인한 값이다.
  doc_weights:
    연차보고서: 1.35
    단계보고서: 1.30
    성과확인서: 1.20
    성과내역서: 1.20
    계획서: 1.10
    발표자료: 1.00
    분석결과: 1.00
    성과확인자료: 0.95
    회의록: 0.85

  # 보고서 초안(src/draft_report.py) 목차별 검색어 교체 (선택).
  # 비워두면 일반 검색어를 쓴다. 과제의 핵심 기술 용어로 채우면 근거 회수율이 오른다.
  draft_queries: {}
  #  "2":
  #    - "실증 데이터 수집 참여자 모집"
  #    - "핵심 기술 A 개발 고도화"
  #    - "핵심 기술 B 효과 검증"

# ── 경로 ─────────────────────────────────────────────────────
paths:
  # 인제스트 대상 문서 폴더. 기존 자료 폴더를 그대로 소스로 쓴다(복사하지 않는다).
  # 폴더 구조(연도 하위폴더 등)에서 연차·문서종류 메타데이터를 뽑는다.
  # 새 자료 폴더를 만들면 여기에 반드시 추가할 것 — 빠지면 조용히 검색되지 않는다.
  sources:
    - "sources/보고서"        # placeholder — 실제 자료 폴더 경로로 교체
    - "sources/회의록"
    - "sources/성과자료"
  # 원본 데이터 저장소 경로 (선택, 읽기 전용 참조용)
  original_data: ""
  # 벡터DB·인덱스 저장 위치 (재생성 가능 산출물)
  storage: "storage"

# ── 임베딩 ───────────────────────────────────────────────────
embedding:
  # 로컬 임베딩 모델 (원문 외부 전송 없음).
  # 검색용으로 대조학습된 모델을 쓸 것 — 문장 유사도(STS) 모델은 하이브리드 검색에서
  # 벡터 비중을 높일수록 성능이 떨어지는 것을 평가셋에서 확인했다 (eval/results.md).
  model: "BAAI/bge-m3"
  device: "auto"          # auto | cpu | cuda
  max_seq_length: 1024    # 모델의 tokenizer 기재값을 믿지 말고 max_position_embeddings를 확인할 것
  batch_size: 16          # bge-m3는 무거워 배치를 줄인다

# ── 평가 ─────────────────────────────────────────────────────
eval:
  k: 8    # 검색·생성 평가에서 LLM에 넘길 근거 개수

  # 생성 채점용 judge LLM (eval/grade_generation.py).
  # 비워두면 아래 llm 섹션과 같은 모델을 쓴다.
  # 같은 모델이 자기 답을 채점하면 관대해지는 편향(self-preference)이 있으므로,
  # 가능하면 답변 생성 모델보다 강한 모델로 분리할 것 (예: provider: anthropic).
  judge:
    provider: ""      # 비우면 llm.provider
    model: ""         # 비우면 llm.model
    base_url: ""      # ollama judge를 다른 서버에 둘 때

# ── 생성 LLM ─────────────────────────────────────────────────
llm:
  provider: "ollama"        # ollama | anthropic (전환 시 코드 변경 없음)
  # 로컬 Ollama면 localhost, 내부망 서버 Ollama면 그 주소로 변경
  base_url: "http://localhost:11434"
  model: "exaone3.5:7.8b"   # 한국어 문서면 한국어 지원 모델 권장
  num_ctx: 8192             # 검색 근거가 들어가야 하므로 기본값(2048)보다 크게
  temperature: 0.2          # 근거 기반 답변 — 창의성보다 정확성
